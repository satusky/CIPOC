<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CIPOC Workbench</title>
  <script>
    /* Resolve the theme before the first paint. Doing this from app.js would
       paint the default palette first and flash. The stored value wins; with
       none, follow the OS. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("cipoc-theme"); } catch (err) { /* blocked */ }
      var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
  <script src="truth.js" defer></script>
  <script src="feedback.js" defer></script>
  <script src="notes.js" defer></script>
  <script src="control.js" defer></script>
  <script src="table.js" defer></script>
  <script src="detail.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>CIPOC</h1>
      <span class="phi" title="This interface renders raw note text, prompts and model output.">
        Internal &middot; PHI and raw model data
      </span>
    </div>

    <nav class="views" role="tablist" aria-label="View">
      <button class="view-tab" role="tab" data-view="notes">Notes</button>
      <button class="view-tab" role="tab" data-view="variables">Variables</button>
    </nav>

    <div id="case-summary" class="case-summary"></div>

    <button id="theme-toggle" class="icon-btn theme-toggle" type="button"></button>
  </header>

  <div id="facts" class="facts" aria-label="Case facts"></div>

  <main class="workspace">
    <section id="stage" class="stage">
      <!-- Notes -->
      <div id="view-notes" class="view" hidden>
        <div class="list-pane">
          <div class="pane-head">
            <h2>Notes</h2>
            <input id="note-filter" class="filter" type="search"
                   placeholder="Filter notes&hellip;" aria-label="Filter notes" />
          </div>
          <ol id="notes-list" class="notes-list"></ol>
        </div>
      </div>

      <!-- Variables -->
      <div id="view-variables" class="view" hidden>
        <div class="pane-head">
          <h2>Variables</h2>
          <div class="modes" role="tablist" aria-label="Variables layout">
            <button class="mode-tab" role="tab" data-mode="control">Control room</button>
            <button class="mode-tab" role="tab" data-mode="table">Tabular</button>
          </div>
          <input id="var-filter" class="filter" type="search"
                 placeholder="Filter variables&hellip;" aria-label="Filter variables" />
          <label class="check"><input id="group-toggle" type="checkbox" checked /> Grouped</label>
          <!-- The control room paints one metric at a time. The Accuracy tab
               is hidden until a ground-truth file is loaded; with none, the
               toolbar and every view below it are unchanged. -->
          <!-- Hidden until a reference file is loaded: with one lens available
               there is no choice to offer. Status is deliberately NOT a lens —
               a bubble already shows status wherever there is no value to rate,
               so a status tab would only repeat what the dot has said. -->
          <div class="lenses" role="tablist" aria-label="Colour variables by" hidden>
            <span class="lens-label">Lens</span>
            <button class="lens-tab" role="tab" data-lens="confidence">Confidence</button>
            <button class="lens-tab" role="tab" data-lens="accuracy" hidden>Accuracy</button>
          </div>
          <label class="check file-pick" title="Load a ground-truth JSON: {item_id: value}">
            <input id="truth-file" type="file" accept="application/json,.json" />
            <span>Ground truth&hellip;</span>
          </label>
        </div>
        <div id="control" class="control" hidden></div>
        <div id="table-wrap" class="table-wrap" hidden></div>
      </div>
    </section>

    <aside id="detail" class="detail" aria-label="Detail" hidden>
      <div class="detail-head">
        <span id="detail-kind" class="chip"></span>
        <h2 id="detail-title"></h2>
        <button id="detail-close" class="icon-btn" title="Close (Esc)" aria-label="Close">&#10005;</button>
      </div>
      <div id="detail-body" class="detail-body"></div>
    </aside>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="boot" class="boot"><p>Loading case state&hellip;</p></div>
</body>
</html>
