[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cipoc-workbench"
version = "1.0.0"
description = "Standalone review workbench for CIPOC extraction results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<1.0",
    "uvicorn>=0.49,<1.0",
]

[project.scripts]
cipoc-workbench = "cipoc_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cipoc_workbench = ["web/*"]
