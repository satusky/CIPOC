[project]
name = "cipoc"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned to Databricks Runtime 18.2 ML CPU preinstalled versions:
    # https://docs.databricks.com/aws/en/release-notes/runtime/18.2ml#python-libraries-on-cpu-clusters
    "databricks-sdk==0.67.0",
    "mlflow-skinny==3.8.1",
    "openai==2.7.0",
    "pandas==2.2.3",
    "pydantic==2.10.6",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "langchain-openai==1.0.2",
    "langchain==1.0.3",
    "langgraph==1.0.3",
    "langchain-core==1.0.4",
    "langgraph-prebuilt==1.0.4",
    "ipython>=9.14.1",
    "grandalf>=0.8",
    "graphviz>=0.21",
    "matplotlib>=3.11.0",
]

[project.optional-dependencies]
# The workbench web frontend only. Deliberately kept OUT of the core dependency
# set so the production DBR-18.2-pinned install is untouched; install with
# `uv sync --extra workbench` (or `pip install -e '.[workbench]'`). The frontend
# itself is dependency-free static files under `src/cipoc/workbench/web/`.
workbench = [
    "fastapi>=0.136,<1.0",
    "uvicorn>=0.49,<1.0",
]
